name: build (Blender 5.2.3 + Cycles Metal for Porthole, Windows Arm64)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Blender tag to build
        default: v5.2.3
      targets:
        description: "Quick check: build only these ninja targets (leave empty for the whole of Blender and a zip)"
        default: ""

jobs:
  build:
    runs-on: windows-11-arm
    timeout-minutes: 350
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: porthole

      - name: Add the Clang compiler to Visual Studio (Blender builds Windows Arm64 with clang)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -prerelease -property installationPath
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $p = Start-Process -FilePath $setup -ArgumentList "modify --installPath `"$vs`" --add Microsoft.VisualStudio.Component.VC.Llvm.Clang --add Microsoft.VisualStudio.Component.VC.Llvm.ClangToolset --quiet --norestart --noUpdateInstaller" -Wait -PassThru
          "installer exit code: $($p.ExitCode)"

      - name: Clone Blender (shallow)
        shell: pwsh
        run: |
          # GitHub's mirror cannot serve the Git LFS assets (brushes); the build does not need them.
          $env:GIT_LFS_SKIP_SMUDGE = "1"
          git clone --depth 1 --branch ${{ inputs.tag }} https://github.com/blender/blender.git C:\b

      - name: Fetch Blender's prebuilt libraries (Blender's own server, Git LFS)
        shell: pwsh
        run: |
          git lfs install --skip-repo
          git clone --depth 1 https://projects.blender.org/blender/lib-windows_arm64.git C:\b\lib\windows_arm64

      - name: Fetch Blender's own data files (Git LFS, from Blender's server; GitHub's mirror only has the pointers)
        shell: pwsh
        run: |
          # Without these the startup file, the preview scenes, the matcaps and the brushes in the build are
          # 130-byte pointer files and Blender dies at startup with a null pointer (seen on a phone, 2026-11-06).
          Set-Location C:\b
          git lfs install --local
          git config lfs.url https://projects.blender.org/blender/blender.git/info/lfs
          git lfs pull
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # (a real startup.blend is zstd-compressed, so it does not start with the text BLENDER)
          $head = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes("C:\b\release\datafiles\startup.blend")[0..6])
          $len = (Get-Item C:\b\release\datafiles\startup.blend).Length
          "startup.blend size: $len"
          if ($len -lt 10000 -or $head -like "version*") { throw "startup.blend is still an LFS pointer" }
          $left = Get-ChildItem C:\b\release, C:\b\assets -Recurse -File | Where-Object { $_.Length -lt 200 -and (Get-Content $_.FullName -TotalCount 1 -ErrorAction SilentlyContinue) -like "version https://git-lfs*" }
          "LFS pointers left under release/ and assets/: " + ($left | Measure-Object).Count
          $left | Select-Object -First 10 FullName

      - name: Apply the Cycles Metal device for Porthole (over winemetal)
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/porthole"
          bash cycles-metal-wm/apply.sh /c/b
          git -C /c/b status --short | head -20

      - name: Install sccache (native Arm64 build; Blender's make.bat has a switch for it)
        shell: pwsh
        run: |
          $v = "v0.19.0"
          Invoke-WebRequest "https://github.com/mozilla/sccache/releases/download/$v/sccache-$v-aarch64-pc-windows-msvc.zip" -OutFile C:\sccache.zip
          Expand-Archive C:\sccache.zip C:\sccache-unpack
          $exe = Get-ChildItem C:\sccache-unpack -Recurse -Filter sccache.exe | Select-Object -First 1
          Copy-Item $exe.FullName C:\sccache.exe
          "C:\" | Out-File -Append -Encoding ascii $env:GITHUB_PATH
          & C:\sccache.exe --version

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: C:\sccache-cache
          key: sccache-${{ github.run_id }}
          restore-keys: sccache-

      - name: Configure and build the whole of Blender
        if: ${{ inputs.targets == '' }}
        working-directory: C:\b
        shell: cmd
        env:
          SCCACHE_DIR: C:\sccache-cache
          SCCACHE_CACHE_SIZE: 6G
        run: |
          call make.bat ninja nobuildinfo sccache

      - name: Configure (quick check)
        if: ${{ inputs.targets != '' }}
        working-directory: C:\b
        shell: cmd
        env:
          SCCACHE_DIR: C:\sccache-cache
          SCCACHE_CACHE_SIZE: 6G
        run: |
          call make.bat ninja nobuildinfo nobuild sccache

      - name: Build the chosen targets (quick check)
        if: ${{ inputs.targets != '' }}
        shell: pwsh
        env:
          SCCACHE_DIR: C:\sccache-cache
          SCCACHE_CACHE_SIZE: 6G
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -prerelease -property installationPath
          $dir = (Get-ChildItem C:\build_windows* -Directory | Select-Object -First 1).FullName
          "build folder: $dir"
          Select-String -Path "$dir\CMakeCache.txt" -Pattern "WITH_CYCLES_DEVICE_METAL" | ForEach-Object { $_.Line }
          # what the compiler is really called with (to see why sccache may refuse a compile)
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" arm64 && cd /d $dir && ninja -t commands ${{ inputs.targets }}" | Select-String -Pattern "sccache" | Select-Object -First 2 | ForEach-Object { "COMPILE COMMAND: " + $_.Line.Substring(0, [Math]::Min(6000, $_.Line.Length)) }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" arm64 && cd /d $dir && ninja ${{ inputs.targets }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Which compiler flag makes sccache refuse (quick check only; removes one flag at a time from a real compile of an empty file)
        if: ${{ inputs.targets != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class Argv {
            [DllImport("shell32.dll", SetLastError = true)] static extern IntPtr CommandLineToArgvW([MarshalAs(UnmanagedType.LPWStr)] string cmd, out int n);
            public static string[] Split(string cmd) {
              int n; IntPtr p = CommandLineToArgvW(cmd, out n);
              string[] r = new string[n];
              for (int i = 0; i < n; i++) r[i] = Marshal.PtrToStringUni(Marshal.ReadIntPtr(p, i * IntPtr.Size));
              return r;
            }
          }
          "@
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -prerelease -property installationPath
          $dir = (Get-ChildItem C:\build_windows* -Directory | Select-Object -First 1).FullName
          Set-Content C:\env.cmd "@echo off`r`ncall `"$vs\VC\Auxiliary\Build\vcvarsall.bat`" arm64 >nul`r`ncd /d $dir"
          $cmds = cmd /c "C:\env.cmd && ninja -t commands ${{ inputs.targets }}"
          $line = ($cmds | Select-String -Pattern "^sccache" | Select-Object -Skip 1 -First 1).Line
          $tok = [Argv]::Split($line)
          $compiler = $tok[1]
          $rest = @($tok[2..($tok.Length - 1)])
          New-Item -ItemType Directory C:\diag -Force | Out-Null
          Set-Content C:\diag\empty.cpp "int main_empty_for_sccache_diag = 0;"
          # outputs go to C:\diag, the source is the empty file
          $args2 = @()
          foreach ($t in $rest) {
            if ($t -like "/Fo*") { $args2 += "/FoC:\diag\x.obj" }
            elseif ($t -like "/Fd*") { $args2 += "/FdC:\diag\x.pdb" }
            elseif ($t -like "-clang:-MT*") { $args2 += "-clang:-MTx.obj" }
            elseif ($t -like "-clang:-MF*") { $args2 += "-clang:-MFC:\diag\x.d" }
            elseif ($t -like "*denoise.cpp" -or $t -like "*.cpp") { $args2 += "C:\diag\empty.cpp" }
            else { $args2 += $t }
          }
          $env:SCCACHE_DIR = "C:\sccache-diag-cache"
          & C:\sccache.exe --stop-server 2>$null | Out-Null
          function NonCacheable($a) {
            & C:\sccache.exe --zero-stats | Out-Null
            Push-Location $dir
            & C:\env.cmd 2>$null | Out-Null
            & C:\sccache.exe $compiler @a 2>&1 | Out-Null
            Pop-Location
            $st = & C:\sccache.exe --show-stats
            $m = ($st | Select-String "Non-cacheable calls\s+(\d+)")
            if ($m) { return [int]$m.Matches[0].Groups[1].Value } else { return -1 }
          }
          # the compile needs the Visual Studio environment (INCLUDE, LIB): run it through a batch file
          function NonCacheableBat($a) {
            $q = ($a | ForEach-Object { '"' + ($_ -replace '"', '\"') + '"' }) -join " "
            Set-Content C:\diag\one.cmd "@echo off`r`ncall C:\env.cmd`r`nC:\sccache.exe `"$compiler`" $q"
            & C:\sccache.exe --zero-stats | Out-Null
            cmd /c C:\diag\one.cmd 2>&1 | Out-Null
            $st = & C:\sccache.exe --show-stats
            $m = ($st | Select-String "Non-cacheable calls\s+(\d+)")
            $h = ($st | Select-String "Cache misses\s+(\d+)")
            if ($m -and $h) { return @([int]$m.Matches[0].Groups[1].Value, [int]$h.Matches[0].Groups[1].Value) } else { return @(-1, -1) }
          }
          $base = NonCacheableBat $args2
          "DIAG baseline (all flags, empty source): non-cacheable=$($base[0]) misses=$($base[1]) args=$($args2.Count)"
          for ($i = 0; $i -lt $args2.Count; $i++) {
            $a = @(); for ($j = 0; $j -lt $args2.Count; $j++) { if ($j -ne $i) { $a += $args2[$j] } }
            $r = NonCacheableBat $a
            if ($r[0] -eq 0) { "DIAG REMOVING THIS MAKES IT CACHEABLE: [$i] " + $args2[$i] + " (misses=$($r[1]))" }
          }
          "DIAG done"
          & C:\sccache.exe --stop-server 2>$null | Out-Null
          exit 0

      - name: Compiler cache statistics
        if: always()
        shell: pwsh
        run: |
          $env:SCCACHE_DIR = "C:\sccache-cache"
          if (Test-Path C:\sccache.exe) { & C:\sccache.exe --show-stats; & C:\sccache.exe --stop-server }
          exit 0

      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: C:\sccache-cache
          key: sccache-${{ github.run_id }}

      - name: Package
        if: ${{ inputs.targets == '' }}
        shell: pwsh
        run: |
          $dir = (Get-ChildItem C:\build_windows* -Directory | Select-Object -First 1).FullName
          $exe = Get-ChildItem "$dir\bin" -Recurse -Filter blender.exe | Select-Object -First 1
          if (-not $exe) { Get-ChildItem $dir -Directory | Select-Object Name; throw "blender.exe not found under $dir\bin" }
          $out = $exe.DirectoryName
          "Blender folder: $out"
          Get-ChildItem $out | Select-Object -First 20 Name
          $src = Get-ChildItem $out -Recurse -Directory -Filter metal | Where-Object { $_.FullName -like "*cycles*kernel*" }
          "Metal kernel folders installed: " + ($src | Measure-Object).Count
          New-Item -ItemType Directory C:\symbols | Out-Null
          Copy-Item "$out\blender.pdb" C:\symbols\blender.pdb
          Get-ChildItem $out -Recurse -Filter *.pdb | Remove-Item -Force
          Compress-Archive -Path "$out\*" -DestinationPath C:\blender-porthole-win-arm64.zip -CompressionLevel Optimal
          (Get-Item C:\blender-porthole-win-arm64.zip).Length / 1MB

      - name: Upload
        if: ${{ inputs.targets == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: blender-porthole-win-arm64
          path: C:\blender-porthole-win-arm64.zip
          compression-level: 0

      - name: Upload the symbols (name a crash address with llvm-pdbutil dump -publics)
        if: ${{ inputs.targets == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: blender-porthole-win-arm64-symbols
          path: C:\symbols\blender.pdb
